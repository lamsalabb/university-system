<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin | Enrollment Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <div class="mb-4">
        <h3 class="fw-bold">Enrollment Management</h3>
        <span class="text-muted">Enroll, view and manage students</span>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body">

            <h5 class="fw-semibold mb-3">Enroll Student</h5>

            <form th:action="@{/admin/enrollments}"
                  th:object="${enrollment}"
                  method="post"
                  class="row g-3">

                <div class="col-md-4">
                    <select class="form-select" th:field="*{student.id}" required>
                        <option value="">Select Student</option>
                        <option th:each="s : ${students}"
                                th:value="${s.id}"
                                th:text="${s.firstName + ' ' + s.lastName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <select class="form-select" th:field="*{course.id}" required>
                        <option value="">Select Course</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.id}"
                                th:text="${c.code + ' - ' + c.title}">
                        </option>
                    </select>
                </div>

                <div class="col-md-2">
                    <input class="form-control" th:field="*{semester}" placeholder="Semester" required>
                </div>

                <div class="col-md-2">
                    <button class="btn btn-primary w-100">Enroll</button>
                </div>

            </form>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <h5 class="fw-semibold mb-3">All Enrollments</h5>

            <div class="row g-3 mb-3">

                <div class="col-md-4">
                    <select id="studentFilter" class="form-select">
                        <option value="">All Students</option>
                        <option th:each="s : ${students}"
                                th:value="${s.firstName + ' ' + s.lastName}"
                                th:text="${s.firstName + ' ' + s.lastName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <select id="courseFilter" class="form-select">
                        <option value="">All Courses</option>
                        <option th:each="c : ${courses}"
                                th:value="${c.code}"
                                th:text="${c.code}">
                        </option>
                    </select>
                </div>

                <div class="col-md-4">
                    <select id="statusFilter" class="form-select">
                        <option value="">All Status</option>
                        <option value="ENROLLED">ENROLLED</option>
                        <option value="DROPPED">DROPPED</option>
                        <option value="COMPLETED">COMPLETED</option>
                    </select>
                </div>

            </div>

            <table id="enrollmentTable" class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                    <th>Student</th>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Status</th>
                    <th>Grade</th>
                    <th style="width:140px">Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="e : ${enrollments}"
                    th:data-student="${e.student.firstName + ' ' + e.student.lastName}"
                    th:data-course="${e.course.code}"
                    th:data-status="${e.status.name()}">

                    <td th:text="${e.student.firstName + ' ' + e.student.lastName}"></td>
                    <td th:text="${e.course.code}"></td>
                    <td th:text="${e.semester}"></td>
                    <td>
                        <span class="badge bg-success" th:if="${e.status.name() == 'ENROLLED'}">ENROLLED</span>
                        <span class="badge bg-danger" th:if="${e.status.name() == 'DROPPED'}">DROPPED</span>
                        <span class="badge bg-secondary" th:if="${e.status.name() == 'COMPLETED'}">COMPLETED</span>
                    </td>
                    <td th:text="${e.grade ?: '-'}"></td>
                    <td>
                        <form th:if="${e.status.name() == 'ENROLLED'}"
                              th:action="@{/admin/enrollments/{id}/drop(id=${e.id})}"
                              method="post">
                            <button class="btn btn-sm btn-outline-danger">Drop</button>
                        </form>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const studentFilter = document.getElementById("studentFilter");
    const courseFilter = document.getElementById("courseFilter");
    const statusFilter = document.getElementById("statusFilter");

    const rows = Array.from(
        document.querySelectorAll("#enrollmentTable tbody tr")
    );

    function applyFilters() {
        const student = studentFilter.value.toLowerCase();
        const course = courseFilter.value;
        const status = statusFilter.value;

        rows.forEach(row => {
            const rStudent = row.dataset.student.toLowerCase();
            const rCourse = row.dataset.course;
            const rStatus = row.dataset.status;

            const match =
                (!student || rStudent.includes(student)) &&
                (!course || rCourse === course) &&
                (!status || rStatus === status);

            row.style.display = match ? "" : "none";
        });
    }

    [studentFilter, courseFilter, statusFilter]
        .forEach(el => el.addEventListener("input", applyFilters));
</script>

</body>
</html>
