<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Admin | Fees</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bold mb-0">Fee Management</h3>
      <span class="text-muted">View & manage student fees</span>
    </div>

    <div class="d-flex gap-2 align-items-center">
      <input id="studentSearch"
             type="text"
             class="form-control form-control-sm"
             placeholder="Search student..."
             style="width: 220px;">

      <select id="statusFilter"
              class="form-select form-select-sm"
              style="width: 160px;">
        <option value="">All Status</option>
        <option value="PAID">Paid</option>
        <option value="UNPAID">Unpaid</option>
      </select>

      <select id="typeFilter"
              class="form-select form-select-sm"
              style="width: 160px;">
        <option value="">All Types</option>
      </select>
    </div>
  </div>

  <div th:if="${fees == null or fees.isEmpty()}"
       class="alert alert-info">
    No fee records found.
  </div>

  <div th:if="${fees != null and !fees.isEmpty()}"
       class="card shadow-sm border-0">

    <div class="card-body">
      <div class="table-responsive">

        <table id="feeTable"
               class="table table-hover align-middle">

          <thead class="table-light">
          <tr>
            <th>Student</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Due Date</th>
            <th>Status</th>
            <th style="width: 180px;">Action</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="f : ${fees}"
              th:data-student="${f.student.firstName + ' ' + f.student.lastName}"
              th:data-status="${f.paid ? 'PAID' : 'UNPAID'}"
              th:data-type="${f.type}">

            <td th:text="${f.student.firstName + ' ' + f.student.lastName}"></td>

            <td th:text="${f.type}"></td>

            <td th:text="${f.amount}"></td>

            <td th:text="${f.dueDate}"></td>

            <td>
              <span th:if="${f.paid}" class="badge bg-success">PAID</span>
              <span th:if="${!f.paid}" class="badge bg-danger">UNPAID</span>
            </td>

            <td>
              <form th:action="@{/admin/fees/toggle}"
                    method="post">
                <input type="hidden"
                       name="feeId"
                       th:value="${f.id}">
                <button class="btn btn-sm"
                        th:classappend="${f.paid} ? 'btn-warning' : 'btn-success'">
                  <span th:text="${f.paid} ? 'Mark Unpaid' : 'Mark Paid'"></span>
                </button>
              </form>
            </td>

          </tr>
          </tbody>

        </table>

      </div>
    </div>
  </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
  const searchInput = document.getElementById("studentSearch");
  const statusFilter = document.getElementById("statusFilter");
  const typeFilter = document.getElementById("typeFilter");
  const rows = Array.from(document.querySelectorAll("#feeTable tbody tr"));

  const types = [...new Set(rows.map(r => r.dataset.type))].sort();
  types.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeFilter.appendChild(opt);
  });

  function applyFilters() {
    const searchText = searchInput.value.toLowerCase();
    const status = statusFilter.value;
    const type = typeFilter.value;

    rows.forEach(row => {
      const student = row.dataset.student.toLowerCase();
      const rowStatus = row.dataset.status;
      const rowType = row.dataset.type;

      const matchStudent = student.includes(searchText);
      const matchStatus = !status || rowStatus === status;
      const matchType = !type || rowType === type;

      row.style.display = (matchStudent && matchStatus && matchType)
              ? ""
              : "none";
    });
  }

  searchInput.addEventListener("input", applyFilters);
  statusFilter.addEventListener("change", applyFilters);
  typeFilter.addEventListener("change", applyFilters);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
