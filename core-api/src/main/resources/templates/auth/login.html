<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>University System | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header-login :: body}"></div>
<main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg border-0 p-4" style="width: 420px;">



        <h4 class="text-center mb-3 fw-bold">Sign In</h4>

        <form th:action="@{/login}" method="post">

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text"
                       name="username"
                       class="form-control"
                       placeholder="Enter your email"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password"
                       name="password"
                       class="form-control"
                       placeholder="Enter your password"
                       required>
            </div>

            <div th:if="${param.error}"
                 class="alert alert-danger text-center py-2">
                Invalid email or password
            </div>

            <div th:if="${param.logout}"
                 class="alert alert-success text-center py-2">
                Logged out successfully
            </div>

            <div class="d-grid mt-4">
                <button type="submit" class="btn btn-warning fw-semibold">
                    Login
                </button>
            </div>
            <div class="text-center mt-3">
                <a th:href="@{/register}" class="text-decoration-none">
                    New student? Register here
                </a>

            </div>

            <div th:if="${param.registered}"
                 class="alert alert-success text-center py-2">
                Registration successful.
            </div>


        </form>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
