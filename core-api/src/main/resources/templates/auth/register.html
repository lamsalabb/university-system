<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Registration | University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- CONTENT -->
<main class="flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card shadow-lg border-0 p-4" style="width: 480px;">

        <h4 class="text-center mb-4 fw-bold">Student Registration</h4>

        <form th:action="@{/register}"
              th:object="${user}"
              method="post">

            <!-- EMAIL (always shown, locked after OTP sent) -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       th:field="*{email}"
                       class="form-control"
                       th:attr="readonly=${otpSent}"
                       required>
            </div>

            <!-- =========================
                 PHASE 1: NORMAL REGISTRATION
                 ========================= -->
            <div th:if="${otpSent == null}">

                <div class="mb-3">
                    <label class="form-label">First Name</label>
                    <input type="text"
                           th:field="*{firstName}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Last Name</label>
                    <input type="text"
                           th:field="*{lastName}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           th:field="*{passwordHash}"
                           class="form-control"
                           required>
                </div>

                <p class="text-center text-muted small">
                    A verification code will be sent to your email.
                </p>
            </div>

            <!-- =========================
                 PHASE 2: OTP VERIFICATION
                 ========================= -->
            <div th:if="${otpSent}">

                <!-- Preserve user fields -->
                <input type="hidden" th:field="*{firstName}">
                <input type="hidden" th:field="*{lastName}">
                <input type="hidden" th:field="*{passwordHash}">

                <div class="mb-3 text-center">
                    <label class="form-label fw-semibold">
                        Enter Verification Code
                    </label>
                    <input type="text"
                           name="otp"
                           class="form-control text-center mx-auto"
                           style="width: 160px; letter-spacing: 6px;"
                           placeholder="OTP"
                           required>
                </div>

                <div th:if="${otpError}"
                     class="alert alert-danger text-center py-2">
                    <span th:text="${otpError}"></span>
                </div>
            </div>

            <!-- SUBMIT -->
            <div class="d-grid mt-4">
                <button type="submit"
                        class="btn btn-warning fw-semibold">
                    Register
                </button>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="text-decoration-none">
                    Already have an account? Login
                </a>
            </div>

        </form>

    </div>
</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
