<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header">
    <nav class="navbar navbar-expand-lg bg-black" style="height: 85px;">
        <div class="container">

            <!-- LOGO -->
            <a class="navbar-brand mx-auto mx-lg-0" th:href="@{/dashboard}">
                <img src="/images/logos/complogo.png"
                     alt="University Logo"
                     style="width: 150px; height: auto;">
            </a>

            <!-- TOGGLER -->
            <button class="navbar-toggler text-white"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- NAV ITEMS -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">

                    <!-- ADMIN LINKS -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white"
                           th:href="@{/admin/dashboard}">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white"
                           th:href="@{/admin/users}">
                            Users
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white"
                           th:href="@{/admin/courses}">
                            Courses
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white"
                           th:href="@{/admin/fees}">
                            Fees
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-white"
                           th:href="@{/admin/reports}">
                            Reports
                        </a>
                    </li>

                    <!-- INSTRUCTOR LINKS -->
                    <li class="nav-item" sec:authorize="hasRole('INSTRUCTOR')">
                        <a class="nav-link text-white"
                           th:href="@{/instructor/dashboard}">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('INSTRUCTOR')">
                        <a class="nav-link text-white"
                           th:href="@{/instructor/courses}">
                            My Courses
                        </a>
                    </li>

                    <!-- STUDENT LINKS -->
                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link text-white"
                           th:href="@{/student/dashboard}">
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link text-white"
                           th:href="@{/student/enrollments}">
                            Enrollments
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link text-white"
                           th:href="@{/student/fees}">
                            Fees
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link text-white"
                           th:href="@{/student/attendance}">
                            Attendance
                        </a>
                    </li>

                    <!-- COMMON LINKS -->
                    <li class="nav-item">
                        <a class="nav-link text-white"
                           th:href="@{/profile}">
                            Account
                        </a>
                    </li>

                    <!-- LOGOUT -->
                    <li class="nav-item ms-3">
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="btn btn-outline-warning btn-sm">
                                Logout
                            </button>
                        </form>
                    </li>

                </ul>
            </div>

        </div>
    </nav>
</header>

</body>
</html>
