<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <h3 class="fw-bold mb-4">My Courses</h3>

    <table class="table table-hover shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Course Code</th>
            <th>Title</th>
            <th>Credits</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="enrollment : ${enrollments}">
            <td th:text="${enrollment.course.code}">CS101</td>
            <td th:text="${enrollment.course.title}">Intro</td>
            <td th:text="${enrollment.course.credits}">3</td>
            <td>
                <span class="badge bg-success"
                      th:if="${enrollment.status.name() == 'ENROLLED'}">
                    Enrolled
                </span>
                <span class="badge bg-secondary"
                      th:if="${enrollment.status.name() == 'DROPPED'}">
                    Dropped
                </span>
            </td>
        </tr>

        <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="4" class="text-center text-muted">
                No enrollments found.
            </td>
        </tr>
        </tbody>
    </table>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
