<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm border-0">
                <div class="card-body text-center p-4">

                    <div class="mb-3">
                        <div class="rounded-circle bg-primary text-white d-inline-flex
                                    align-items-center justify-content-center"
                             style="width: 90px; height: 90px; font-size: 36px;">
                            <span th:text="${student.firstName.substring(0,1)}"></span>
                        </div>
                    </div>

                    <h4 class="fw-bold mb-1"
                        th:text="${student.firstName + ' ' + student.lastName}">
                        John Doe
                    </h4>

                    <span class="badge bg-info mb-3">STUDENT</span>

                    <hr>

                    <div class="text-start px-3">
                        <p class="mb-2">
                            <strong>Email:</strong>
                            <span th:text="${student.email}">email@example.com</span>
                        </p>

                        <p class="mb-0">
                            <strong>Status:</strong>
                            <span class="badge"
                                  th:classappend="${student.isActive} ? 'bg-success' : 'bg-danger'"
                                  th:text="${student.isActive} ? 'Active' : 'Inactive'">
                            </span>
                        </p>
                    </div>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
