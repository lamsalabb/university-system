<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <h3 class="fw-bold mb-4">Attendance Records</h3>

    <table class="table table-striped shadow-sm bg-white">
        <thead class="table-dark">
        <tr>
            <th>Course</th>
            <th>Date</th>
            <th>Status</th>
            <th>Remarks</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="a : ${attendanceList}">
            <td th:text="${a.enrollment.course.title}">Course</td>
            <td th:text="${a.sessionDate}">2025-01-01</td>
            <td>
                <span class="badge bg-success" th:if="${a.status.name() == 'PRESENT'}">Present</span>
                <span class="badge bg-danger" th:if="${a.status.name() == 'ABSENT'}">Absent</span>
                <span class="badge bg-warning text-dark" th:if="${a.status.name() == 'EXCUSED'}">Excused</span>
            </td>
            <td th:text="${a.remarks}">—</td>
        </tr>

        <tr th:if="${#lists.isEmpty(attendanceList)}">
            <td colspan="4" class="text-center text-muted">
                No attendance records available.
            </td>
        </tr>
        </tbody>
    </table>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
