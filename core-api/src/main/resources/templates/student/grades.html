<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Grades | University System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <h2 class="fw-bold mb-4">My Grades</h2>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <table class="table align-middle">
                <thead class="table-light">
                <tr>
                    <th>Course</th>
                    <th>Semester</th>
                    <th>Status</th>
                    <th>Grade</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="enrollment : ${enrollments}">
                    <td th:text="${enrollment.course.title}">Course</td>
                    <td th:text="${enrollment.semester}">Semester</td>
                    <td>
                        <span class="badge bg-info"
                              th:text="${enrollment.status}">Status</span>
                    </td>
                    <td>
                        <span th:if="${enrollment.grade != null}"
                              class="fw-bold"
                              th:text="${enrollment.grade}">
                        </span>
                        <span th:if="${enrollment.grade == null}"
                              class="text-muted">
                            Not Graded
                        </span>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
