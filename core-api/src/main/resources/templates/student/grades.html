<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>My Grades | University System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">My Grades</h2>

        <select id="semesterFilter"
                class="form-select form-select-sm"
                style="width: 220px;">
            <option value="">All Semesters</option>
        </select>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">

            <div class="table-responsive">
                <table id="gradesTable"
                       class="table align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th>Course</th>
                        <th>Semester</th>
                        <th>Status</th>
                        <th>Grade</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="enrollment : ${enrollments}"
                        th:data-semester="${enrollment.semester}">

                        <td th:text="${enrollment.course.title}">
                            Course
                        </td>

                        <td th:text="${enrollment.semester}">
                            Semester
                        </td>

                        <td>
                            <span class="badge bg-info"
                                  th:text="${enrollment.status}">
                                Status
                            </span>
                        </td>

                        <td>
                            <span th:if="${enrollment.grade != null}"
                                  class="fw-bold"
                                  th:text="${enrollment.grade}">
                            </span>

                            <span th:if="${enrollment.grade == null}"
                                  class="text-muted">
                                Not Graded
                            </span>
                        </td>

                    </tr>

                    <tr th:if="${#lists.isEmpty(enrollments)}">
                        <td colspan="4"
                            class="text-center text-muted py-4">
                            No grade records available.
                        </td>
                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const semesterFilter = document.getElementById("semesterFilter");
    const rows = Array.from(
        document.querySelectorAll("#gradesTable tbody tr")
    ).filter(r => r.dataset.semester);

    const semesters = [...new Set(rows.map(r => r.dataset.semester))].sort();
    semesters.forEach(sem => {
        const opt = document.createElement("option");
        opt.value = sem;
        opt.textContent = sem;
        semesterFilter.appendChild(opt);
    });

    semesterFilter.addEventListener("change", () => {
        const selected = semesterFilter.value;

        rows.forEach(row => {
            row.style.display =
                !selected || row.dataset.semester === selected
                    ? ""
                    : "none";
        });
    });
</script>

</body>
</html>
