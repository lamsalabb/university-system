<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Instructor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 container-fluid px-5 py-5">

    <div class="text-center mb-5">
        <h2 class="fw-bold">Instructor Dashboard</h2>
        <p class="text-muted">Manage courses, students, attendance, and grades</p>
    </div>

    <div class="row g-4 justify-content-center">

        <div class="col-lg-3 col-md-4">
            <div class="card h-100 shadow-sm p-4 text-center">
                <h5>My Courses</h5>
                <p class="text-muted">Courses you teach</p>
                <a th:href="@{/instructor/courses}" class="btn btn-warning mt-auto">View Courses</a>
            </div>
        </div>

        <div class="col-lg-3 col-md-4">
            <div class="card h-100 shadow-sm p-4 text-center">
                <h5>Students</h5>
                <p class="text-muted">View enrolled students</p>
                <a th:href="@{/instructor/students}" class="btn btn-warning mt-auto">View Students</a>
            </div>
        </div>

        <div class="col-lg-3 col-md-4">
            <div class="card h-100 shadow-sm p-4 text-center">
                <h5>Attendance</h5>
                <p class="text-muted">Mark & review attendance</p>
                <a th:href="@{/instructor/attendance}" class="btn btn-warning mt-auto">Attendance</a>
            </div>
        </div>

        <div class="col-lg-3 col-md-4">
            <div class="card h-100 shadow-sm p-4 text-center">
                <h5>Grades</h5>
                <p class="text-muted">Assign student grades</p>
                <a th:href="@{/instructor/grades}" class="btn btn-warning mt-auto">Grades</a>
            </div>
        </div>


        <div class="col-lg-3 col-md-4">
            <div class="card h-100 shadow-sm p-4 text-center">
                <h5>Profile</h5>
                <p class="text-muted">Account information</p>
                <a th:href="@{/instructor/profile}" class="btn btn-warning mt-auto">Profile</a>
            </div>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
