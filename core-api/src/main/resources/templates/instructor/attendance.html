<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Instructor | Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- ✅ HEADER FRAGMENT -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Attendance Records</h3>
        <span class="text-muted">View & update student attendance</span>
    </div>

    <!-- EMPTY STATE -->
    <div th:if="${attendances == null or attendances.isEmpty()}"
         class="alert alert-info">
        No attendance records found.
    </div>

    <!-- TABLE -->
    <div th:if="${attendances != null and !attendances.isEmpty()}"
         class="card shadow-sm border-0">

        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Student</th>
                        <th>Course</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th style="width: 220px;">Update</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="a : ${attendances}">

                        <!-- Student -->
                        <td th:text="${a.enrollment.student.firstName + ' ' + a.enrollment.student.lastName}">
                            Student Name
                        </td>

                        <!-- Course -->
                        <td th:text="${a.enrollment.course.code}">
                            Course
                        </td>

                        <!-- Date -->
                        <td th:text="${a.sessionDate}">
                            Date
                        </td>

                        <!-- Status Badge -->
                        <td>
                            <span th:if="${a.status.name() == 'PRESENT'}"
                                  class="badge bg-success">PRESENT</span>

                            <span th:if="${a.status.name() == 'ABSENT'}"
                                  class="badge bg-danger">ABSENT</span>

                            <span th:if="${a.status.name() == 'EXCUSED'}"
                                  class="badge bg-warning text-dark">EXCUSED</span>
                        </td>

                        <!-- Update Form -->
                        <td>
                            <form th:action="@{/instructor/attendance/update}"
                                  method="post"
                                  class="d-flex gap-2 align-items-center">

                                <input type="hidden"
                                       name="attendanceId"
                                       th:value="${a.id}"/>

                                <select name="status"
                                        class="form-select form-select-sm">

                                    <option value="PRESENT"
                                            th:selected="${a.status.name() == 'PRESENT'}">
                                        PRESENT
                                    </option>

                                    <option value="ABSENT"
                                            th:selected="${a.status.name() == 'ABSENT'}">
                                        ABSENT
                                    </option>

                                    <option value="EXCUSED"
                                            th:selected="${a.status.name() == 'EXCUSED'}">
                                        EXCUSED
                                    </option>
                                </select>

                                <button type="submit"
                                        class="btn btn-sm btn-primary">
                                    Save
                                </button>

                            </form>
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </div>

</main>

<!-- ✅ FOOTER FRAGMENT -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
