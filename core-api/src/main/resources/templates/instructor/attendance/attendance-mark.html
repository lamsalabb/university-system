<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mark Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Mark Attendance</h3>
        <span class="text-muted">
            Session Date:
            <strong th:text="${today}">Today</strong>
        </span>
    </div>

    <form th:action="@{/instructor/attendance/mark/save}"
          method="post">

        <input type="hidden"
               name="courseId"
               th:value="${enrollments[0].course.id}"/>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">

                <div class="table-responsive">
                    <table class="table align-middle mb-0">

                        <thead class="table-dark">
                        <tr>
                            <th>Student</th>
                            <th>Email</th>
                            <th class="text-center">Present</th>
                            <th class="text-center">Absent</th>
                            <th class="text-center">Excused</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="e : ${enrollments}">

                            <td th:text="${e.student.firstName + ' ' + e.student.lastName}">
                                Student Name
                            </td>

                            <td th:text="${e.student.email}">
                                email
                            </td>

                            <td class="text-center">
                                <input type="radio"
                                       th:name="'status_' + ${e.id}"
                                       value="PRESENT"
                                       checked>
                            </td>

                            <td class="text-center">
                                <input type="radio"
                                       th:name="'status_' + ${e.id}"
                                       value="ABSENT">
                            </td>

                            <td class="text-center">
                                <input type="radio"
                                       th:name="'status_' + ${e.id}"
                                       value="EXCUSED">
                            </td>

                        </tr>

                        <tr th:if="${#lists.isEmpty(enrollments)}">
                            <td colspan="5"
                                class="text-center text-muted py-4">
                                No students enrolled.
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

        <div class="text-end mt-4">
            <button type="submit"
                    class="btn btn-success btn-lg px-5">
                Save Attendance
            </button>
        </div>

    </form>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
