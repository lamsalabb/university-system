<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Select Course | Attendance</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

    <div class="text-center mb-5">
        <h3 class="fw-bold">Mark Attendance</h3>
        <p class="text-muted">Select a course to mark today’s attendance</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <form method="get"
                          th:action="@{/instructor/attendance/mark/{courseId}(courseId=${0})}"
                          id="courseForm">

                        <label class="form-label fw-semibold">
                            Course
                        </label>

                        <select class="form-select mb-3"
                                id="courseSelect"
                                required>
                            <option value="" disabled selected>
                                -- Select Course --
                            </option>

                            <option th:each="c : ${courses}"
                                    th:value="${c.id}"
                                    th:text="${c.code + ' - ' + c.title}">
                            </option>
                        </select>

                        <button type="submit"
                                class="btn btn-success w-100"
                                disabled
                                id="submitBtn">
                            Continue
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const select = document.getElementById("courseSelect");
    const form = document.getElementById("courseForm");
    const button = document.getElementById("submitBtn");

    select.addEventListener("change", () => {
        button.disabled = false;
        form.action = `/instructor/attendance/mark/${select.value}`;
    });
</script>

</body>
</html>
