<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Instructor | Attendance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow-1 container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0">Attendance Records</h3>
            <span class="text-muted">View & update student attendance</span>
        </div>

        <div class="d-flex gap-2 align-items-center">

            <a th:href="@{/instructor/attendance/select-course}"
               class="btn btn-success btn-sm px-3">
                Mark Attendance
            </a>

            <input id="studentSearch"
                   type="text"
                   class="form-control form-control-sm"
                   placeholder="Search student..."
                   style="width: 220px;">

            <select id="courseFilter"
                    class="form-select form-select-sm"
                    style="width: 200px;">
                <option value="">All Subjects</option>
            </select>
        </div>
    </div>

    <div th:if="${attendances == null or attendances.isEmpty()}"
         class="alert alert-info">
        No attendance records found.
    </div>

    <div th:if="${attendances != null and !attendances.isEmpty()}"
         class="card shadow-sm border-0">

        <div class="card-body">
            <div class="table-responsive">

                <table id="attendanceTable"
                       class="table table-hover align-middle">

                    <thead class="table-light">
                    <tr>
                        <th>Student</th>
                        <th>Course</th>
                        <th>Date</th>
                        <th>Status</th>
                        <th style="width:220px;">Update</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="a : ${attendances}"
                        th:data-student="${a.enrollment.student.firstName + ' ' + a.enrollment.student.lastName}"
                        th:data-course="${a.enrollment.course.code}">

                        <td th:text="${a.enrollment.student.firstName + ' ' + a.enrollment.student.lastName}"></td>
                        <td th:text="${a.enrollment.course.code}"></td>
                        <td th:text="${a.sessionDate}"></td>

                        <td>
                            <span th:if="${a.status.name() == 'PRESENT'}" class="badge bg-success">PRESENT</span>
                            <span th:if="${a.status.name() == 'ABSENT'}" class="badge bg-danger">ABSENT</span>
                            <span th:if="${a.status.name() == 'EXCUSED'}" class="badge bg-warning text-dark">EXCUSED</span>
                        </td>

                        <td>
                            <form th:action="@{/instructor/attendance/update}"
                                  method="post"
                                  class="d-flex gap-2">

                                <input type="hidden" name="attendanceId" th:value="${a.id}"/>

                                <select name="status" class="form-select form-select-sm">
                                    <option value="PRESENT" th:selected="${a.status.name() == 'PRESENT'}">PRESENT</option>
                                    <option value="ABSENT" th:selected="${a.status.name() == 'ABSENT'}">ABSENT</option>
                                    <option value="EXCUSED" th:selected="${a.status.name() == 'EXCUSED'}">EXCUSED</option>
                                </select>

                                <button class="btn btn-sm btn-primary">Save</button>
                            </form>
                        </td>

                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const searchInput = document.getElementById("studentSearch");
    const courseFilter = document.getElementById("courseFilter");
    const rows = [...document.querySelectorAll("#attendanceTable tbody tr")];

    const courses = [...new Set(rows.map(r => r.dataset.course))].sort();
    courses.forEach(c => {
        const o = document.createElement("option");
        o.value = c;
        o.textContent = c;
        courseFilter.appendChild(o);
    });

    function applyFilters() {
        const text = searchInput.value.toLowerCase();
        const course = courseFilter.value;

        rows.forEach(r => {
            const matchStudent = r.dataset.student.toLowerCase().includes(text);
            const matchCourse = !course || r.dataset.course === course;
            r.style.display = (matchStudent && matchCourse) ? "" : "none";
        });
    }

    searchInput.addEventListener("input", applyFilters);
    courseFilter.addEventListener("change", applyFilters);
</script>

</body>
</html>
