<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
  <h3 class="fw-bold mb-4">My Profile</h3>

  <ul class="list-group shadow-sm">
    <li class="list-group-item"><b>Name:</b> <span th:text="${user.firstName + ' ' + user.lastName}"></span></li>
    <li class="list-group-item"><b>Email:</b> <span th:text="${user.email}"></span></li>
    <li class="list-group-item"><b>Role:</b> Instructor</li>
  </ul>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
