<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Enrolled Students | Instructor</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

  <!-- PAGE HEADER + FILTERS -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <h3 class="fw-bold mb-0">Enrolled Students</h3>

    <div class="d-flex gap-2">

      <!-- COURSE FILTER -->
      <select id="courseFilter"
              class="form-select form-select-sm"
              style="width: 220px;">
        <option value="">All Courses</option>
      </select>

      <!-- SEMESTER FILTER -->
      <select id="semesterFilter"
              class="form-select form-select-sm"
              style="width: 200px;">
        <option value="">All Semesters</option>
      </select>

    </div>
  </div>

  <!-- TABLE -->
  <div class="card shadow-sm border-0">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table id="studentsTable"
               class="table table-hover align-middle mb-0">

          <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Course</th>
            <th>Semester</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="enrollment : ${enrollments}"
              th:data-course="${enrollment.course.title}"
              th:data-semester="${enrollment.semester}">

            <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">
              Student Name
            </td>

            <td th:text="${enrollment.student.email}">
              email@uni.edu
            </td>

            <td th:text="${enrollment.course.title}">
              Course
            </td>

            <td th:text="${enrollment.semester}">
              Semester
            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="4"
                class="text-center text-muted py-4">
              No enrolled students found.
            </td>
          </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- FILTER SCRIPT -->
<script>
  const courseFilter = document.getElementById("courseFilter");
  const semesterFilter = document.getElementById("semesterFilter");

  const rows = Array.from(
          document.querySelectorAll("#studentsTable tbody tr")
  ).filter(r => r.dataset.course);

  /* Populate filters */
  const courses = [...new Set(rows.map(r => r.dataset.course))].sort();
  const semesters = [...new Set(rows.map(r => r.dataset.semester))].sort();

  courses.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    courseFilter.appendChild(opt);
  });

  semesters.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    semesterFilter.appendChild(opt);
  });

  /* Apply filters */
  function applyFilters() {
    const selectedCourse = courseFilter.value;
    const selectedSemester = semesterFilter.value;

    rows.forEach(row => {
      const matchCourse =
              !selectedCourse || row.dataset.course === selectedCourse;

      const matchSemester =
              !selectedSemester || row.dataset.semester === selectedSemester;

      row.style.display =
              matchCourse && matchSemester ? "" : "none";
    });
  }

  courseFilter.addEventListener("change", applyFilters);
  semesterFilter.addEventListener("change", applyFilters);
</script>

</body>
</html>
