<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Students</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5">
  <h3 class="fw-bold mb-4">Enrolled Students</h3>

  <table class="table table-hover shadow-sm">
    <thead class="table-dark">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Course</th>
      <th>Semester</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="enrollment : ${enrollments}">
      <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}"></td>
      <td th:text="${enrollment.student.email}"></td>
      <td th:text="${enrollment.course.title}"></td>
      <td th:text="${enrollment.semester}"></td>
    </tr>
    </tbody>
  </table>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
