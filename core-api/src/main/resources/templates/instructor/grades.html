<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Instructor | Grades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 container py-5">

  <!-- HEADER + FILTERS -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
    <div>
      <h3 class="fw-bold mb-0">Student Grades</h3>
      <span class="text-muted">Assign & update grades</span>
    </div>

    <div class="d-flex gap-2">

      <!-- COURSE FILTER -->
      <select id="courseFilter"
              class="form-select form-select-sm"
              style="width: 220px;">
        <option value="">All Courses</option>
      </select>

      <!-- SEMESTER FILTER -->
      <select id="semesterFilter"
              class="form-select form-select-sm"
              style="width: 200px;">
        <option value="">All Semesters</option>
      </select>

    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">

      <div class="table-responsive">
        <table id="gradesTable"
               class="table table-hover align-middle mb-0">

          <thead class="table-light">
          <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Status</th>
            <th style="width: 160px;">Grade</th>
            <th style="width: 120px;">Action</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="enrollment : ${enrollments}"
              th:data-course="${enrollment.course.code + ' - ' + enrollment.course.title}"
              th:data-semester="${enrollment.semester}">

            <!-- Student -->
            <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">
              Student Name
            </td>

            <!-- Course -->
            <td th:text="${enrollment.course.code + ' - ' + enrollment.course.title}">
              Course
            </td>

            <!-- Semester -->
            <td th:text="${enrollment.semester}">
              Semester
            </td>

            <!-- Status -->
            <td>
                            <span class="badge"
                                  th:classappend="${enrollment.status.name() == 'COMPLETED'} ? 'bg-success'
                                  : (${enrollment.status.name() == 'ENROLLED'} ? 'bg-warning text-dark'
                                  : 'bg-secondary')"
                                  th:text="${enrollment.status}">
                            </span>
            </td>

            <!-- Grade + Save -->
            <td colspan="2">
              <form th:action="@{/instructor/grades/update}"
                    method="post"
                    class="d-flex gap-2 align-items-center">

                <input type="hidden"
                       name="enrollmentId"
                       th:value="${enrollment.id}"/>

                <select name="grade"
                        class="form-select form-select-sm"
                        th:disabled="${enrollment.status.name() == 'DROPPED'}">

                  <option value="">--</option>

                  <option th:each="g : ${grades}"
                          th:value="${g}"
                          th:text="${g}"
                          th:selected="${g == enrollment.grade}">
                  </option>
                </select>

                <button type="submit"
                        class="btn btn-sm btn-primary"
                        th:disabled="${enrollment.status.name() == 'DROPPED'}">
                  Save
                </button>

              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="6" class="text-center text-muted py-4">
              No enrollments found.
            </td>
          </tr>
          </tbody>

        </table>
      </div>

    </div>
  </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

<!-- FILTER SCRIPT -->
<script>
  const courseFilter = document.getElementById("courseFilter");
  const semesterFilter = document.getElementById("semesterFilter");

  const rows = Array.from(
          document.querySelectorAll("#gradesTable tbody tr")
  ).filter(r => r.dataset.course);

  /* Populate filters */
  const courses = [...new Set(rows.map(r => r.dataset.course))].sort();
  const semesters = [...new Set(rows.map(r => r.dataset.semester))].sort();

  courses.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    courseFilter.appendChild(opt);
  });

  semesters.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    semesterFilter.appendChild(opt);
  });

  /* Apply filters */
  function applyFilters() {
    const selectedCourse = courseFilter.value;
    const selectedSemester = semesterFilter.value;

    rows.forEach(row => {
      const matchCourse =
              !selectedCourse || row.dataset.course === selectedCourse;

      const matchSemester =
              !selectedSemester || row.dataset.semester === selectedSemester;

      row.style.display =
              matchCourse && matchSemester ? "" : "none";
    });
  }

  courseFilter.addEventListener("change", applyFilters);
  semesterFilter.addEventListener("change", applyFilters);
</script>

</body>
</html>
