<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Assign Grades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<main class="container py-5 flex-grow-1">

  <h2 class="fw-bold mb-4">Assign Grades</h2>

  <table class="table align-middle">
    <thead>
    <tr>
      <th>Student</th>
      <th>Course</th>
      <th>Grade</th>
      <th>Action</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="enrollment : ${enrollments}">
      <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}"></td>
      <td th:text="${enrollment.course.title}"></td>

      <td>
        <form th:action="@{/instructor/grades/{id}(id=${enrollment.id})}"
              method="post" class="d-flex gap-2">

          <input type="text"
                 name="grade"
                 class="form-control"
                 placeholder="A, B+, C..."
                 required>

          <button class="btn btn-warning">Save</button>
        </form>
      </td>

      <td th:text="${enrollment.grade ?: '—'}"></td>
    </tr>
    </tbody>
  </table>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
