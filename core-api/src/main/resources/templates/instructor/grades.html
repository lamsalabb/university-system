<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Instructor | Grades</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- HEADER -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- MAIN CONTENT -->
<main class="flex-grow-1 container py-5">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h3 class="fw-bold">Student Grades</h3>
    <span class="text-muted">Assign & update grades</span>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">

      <div class="table-responsive">
        <table class="table table-hover align-middle">

          <thead class="table-light">
          <tr>
            <th>Student</th>
            <th>Course</th>
            <th>Semester</th>
            <th>Status</th>
            <th style="width: 160px;">Grade</th>
            <th style="width: 120px;">Action</th>
          </tr>
          </thead>

          <tbody>
          <tr th:each="enrollment : ${enrollments}">

            <!-- Student -->
            <td th:text="${enrollment.student.firstName + ' ' + enrollment.student.lastName}">
              Student Name
            </td>

            <!-- Course -->
            <td th:text="${enrollment.course.code + ' - ' + enrollment.course.title}">
              Course
            </td>

            <!-- Semester -->
            <td th:text="${enrollment.semester}">
              Semester
            </td>

            <!-- Status -->
            <td>
                            <span class="badge"
                                  th:classappend="${enrollment.status.name() == 'COMPLETED'} ? 'bg-success'
                                                  : (${enrollment.status.name() == 'ENROLLED'} ? 'bg-warning text-dark'
                                                  : 'bg-secondary')"
                                  th:text="${enrollment.status}">
                            </span>
            </td>

            <!-- Grade + Save -->
            <td colspan="2">

              <form th:action="@{/instructor/grades/update}"
                    method="post"
                    class="d-flex gap-2 align-items-center">

                <input type="hidden"
                       name="enrollmentId"
                       th:value="${enrollment.id}"/>

                <select name="grade"
                        class="form-select form-select-sm"
                        th:disabled="${enrollment.status.name() == 'DROPPED'}">

                  <option value="">--</option>

                  <option th:each="g : ${grades}"
                          th:value="${g}"
                          th:text="${g}"
                          th:selected="${g == enrollment.grade}">
                  </option>
                </select>

                <button type="submit"
                        class="btn btn-sm btn-primary"
                        th:disabled="${enrollment.status.name() == 'DROPPED'}">
                  Save
                </button>

              </form>

            </td>

          </tr>

          <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="6" class="text-center text-muted py-4">
              No enrollments found.
            </td>
          </tr>

          </tbody>
        </table>
      </div>

    </div>
  </div>

</main>

<!-- FOOTER -->
<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
